<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for social media icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="container">
    <!-- Top Card -->
    <div class="card-top">
      <div class="image-box">
        <img src="Images/person.jpg" alt="Profile">
      </div>
    </div>

    <!-- Meet Our Team Card -->
    <div class="card-middle">
      <h2>Meet Our Team</h2>
      <div class="team-member">
        <img src="Images/user.jpg" alt="Michael Brown">
        <h3>Michael Brown</h3>
        <p><i class="fa-solid fa-code"></i> Frontend Developer</p>
      </div>
    </div>

    <!-- Social Media Profile Card -->
    <div class="card-bottom">
      <div class="profile">
        <img src="Images/person 2.jpeg" alt="Krish R">
        <h3>Krish R</h3>
        <p>Instructor</p>
      </div>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
      <p class="description">
        Subscribe Easy Tutorials YouTube channel to watch more videos on Web design
      </p>
    </div>
  </div>
</body>
</html>
